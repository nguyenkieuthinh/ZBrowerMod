<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dịch nhanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#e9f0f1;--card:#ffffff;--out:#f4f9f9;--ink:#12262b;--muted:#5f7a80;--line:#d3e0e2;
  --accent:#0e7c86;--accent-ink:#ffffff;--err:#b3341f;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1719;--card:#142124;--out:#101c1f;--ink:#e4f0f1;--muted:#8fa9ae;--line:#26393d;
    --accent:#4cc3cb;--accent-ink:#0d1719;--err:#ff8a73;color-scheme:dark}
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh}
main{max-width:960px;margin:0 auto;padding:clamp(20px,5vw,56px) 18px 40px}
h1{font-size:clamp(28px,5vw,38px);font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 26px;max-width:52ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px}
select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:12px 20px;font:500 16px var(--sans);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;padding:0;transition:background .15s,color .15s,border-color .15s}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.icon.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.panes{grid-template-columns:1fr}.bar{grid-template-columns:1fr auto 1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;
  display:flex;flex-direction:column;min-height:250px}
.pane.out{background:var(--out);border-left:4px solid var(--accent)}
textarea,.text{flex:1;width:100%;border:0;outline:0;background:transparent;color:var(--ink);
  font-size:20px;line-height:1.5;resize:none;min-height:150px;white-space:pre-wrap;word-break:break-word}
textarea{font-family:var(--sans)}
.text{font-family:var(--serif);font-size:22px}
.text.empty{color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.meta{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.meta.err{color:var(--err)}

details.voice{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
summary{cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 24px;margin-top:16px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
label b{color:var(--ink);font-weight:500;float:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--sans);
  padding:11px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
footer{margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-say" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>

<main>
  <h1>Dịch nhanh</h1>
  <p class="sub">Gõ, nói hoặc dán văn bản. Bản dịch hiện ngay và đọc lại bằng giọng bạn chọn.</p>

  <div class="bar">
    <select id="from" aria-label="Ngôn ngữ gốc"></select>
    <button class="icon" id="swap" title="Đổi chiều dịch" aria-label="Đổi chiều dịch"><svg class="ic"><use href="#i-swap"/></svg></button>
    <select id="to" aria-label="Ngôn ngữ đích"></select>
  </div>

  <section class="panes">
    <div class="pane">
      <textarea id="src" maxlength="5000" placeholder="Nhập hoặc dán văn bản cần dịch" aria-label="Văn bản gốc"></textarea>
      <div class="tools">
        <button class="icon" id="mic" title="Nói để nhập" aria-label="Nói để nhập"><svg class="ic"><use href="#i-mic"/></svg></button>
        <button class="icon" id="clear" title="Xóa" aria-label="Xóa"><svg class="ic"><use href="#i-x"/></svg></button>
        <span class="meta" id="count">0/5000</span>
      </div>
    </div>
    <div class="pane out">
      <div class="text empty" id="dst" aria-live="polite">Bản dịch sẽ hiện ở đây</div>
      <div class="tools">
        <button class="icon" id="say" title="Nghe bản dịch" aria-label="Nghe bản dịch"><svg class="ic"><use href="#i-say"/></svg></button>
        <button class="icon" id="copy" title="Sao chép" aria-label="Sao chép"><svg class="ic"><use href="#i-copy"/></svg></button>
        <span class="meta" id="status"></span>
      </div>
    </div>
  </section>

  <details class="voice" open>
    <summary>Giọng đọc</summary>
    <div class="grid">
      <label>Giọng
        <select id="voice"></select>
      </label>
      <label>Tốc độ <b id="rateV"></b>
        <input type="range" id="rate" min="0.5" max="1.8" step="0.05">
      </label>
      <label>Cao độ <b id="pitchV"></b>
        <input type="range" id="pitch" min="0" max="2" step="0.1">
      </label>
      <label>Âm lượng <b id="volV"></b>
        <input type="range" id="vol" min="0" max="1" step="0.05">
      </label>
      <button class="btn" id="test">Nghe thử</button>
    </div>
  </details>

  <footer>Bản dịch do MyMemory cung cấp (miễn phí, có giới hạn mỗi ngày). Giọng đọc lấy từ giọng cài sẵn trên thiết bị của bạn.</footer>
</main>

<script>
const $ = s => document.querySelector(s);
const LANGS = [
  ["vi","Tiếng Việt","vi-VN"],["en","English","en-US"],["ja","日本語","ja-JP"],["ko","한국어","ko-KR"],
  ["zh-CN","中文","zh-CN"],["fr","Français","fr-FR"],["de","Deutsch","de-DE"],["es","Español","es-ES"],
  ["th","ไทย","th-TH"],["ru","Русский","ru-RU"],["it","Italiano","it-IT"],["pt","Português","pt-BR"],["id","Indonesia","id-ID"]
];
const info = c => LANGS.find(l => l[0] === c) || LANGS[0];

let S = {from:"auto", to:"en", voice:{}, rate:1, pitch:1, vol:1};
try { Object.assign(S, JSON.parse(localStorage.getItem("dn") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("dn", JSON.stringify(S)); } catch (e) {} };

const opts = LANGS.map(l => `<option value="${l[0]}">${l[1]}</option>`).join("");
$("#from").innerHTML = '<option value="auto">Tự phát hiện</option>' + opts;
$("#to").innerHTML = opts;
$("#from").value = S.from; $("#to").value = S.to;

/* ---------- Dịch ---------- */
const enc = s => new TextEncoder().encode(s).length;
const dec = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };

function split(line) {
  const sents = (line.match(/[^.!?。！？]+[.!?。！？]*/g) || []).map(x => x.trim()).filter(Boolean);
  const out = []; let cur = "";
  const push = p => { if (cur && enc(cur + " " + p) > 440) { out.push(cur); cur = p; } else cur = cur ? cur + " " + p : p; };
  for (const p of sents) {
    if (enc(p) > 440) for (let i = 0; i < p.length; i += 120) push(p.slice(i, i + 120));
    else push(p);
  }
  if (cur) out.push(cur);
  return out;
}

async function tr(q) {
  const f = S.from === "auto" ? "Autodetect" : S.from;
  const u = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + f + "|" + S.to;
  const r = await fetch(u);
  const j = await r.json();
  if (j.responseStatus != 200) throw new Error(dec(j.responseDetails || "Không dịch được, thử lại sau."));
  return dec(j.responseData.translatedText);
}

let timer, seq = 0;
const src = $("#src"), dst = $("#dst");

function setOut(t) { dst.textContent = t; dst.classList.toggle("empty", !t); }
function status(m, err) { const s = $("#status"); s.textContent = m || ""; s.classList.toggle("err", !!err); }
function schedule() {
  clearTimeout(timer);
  $("#count").textContent = src.value.length + "/5000";
  timer = setTimeout(run, 600);
}

async function run() {
  const text = src.value.trim(), id = ++seq;
  if (!text) { setOut(""); dst.textContent = "Bản dịch sẽ hiện ở đây"; dst.classList.add("empty"); status(""); return; }
  if (S.from === S.to) { setOut(text); status(""); return; }
  status("Đang dịch…");
  try {
    const lines = text.split("\n"), res = [];
    for (const line of lines) {
      const parts = split(line), outs = [];
      for (const p of parts) { outs.push(await tr(p)); if (id !== seq) return; }
      res.push(outs.join(" "));
    }
    setOut(res.join("\n")); status("");
  } catch (e) {
    if (id === seq) status(e.message, true);
  }
}

src.addEventListener("input", schedule);
$("#from").onchange = e => { S.from = e.target.value; save(); run(); };
$("#to").onchange = e => { S.to = e.target.value; save(); fillVoices(); run(); };
$("#swap").onclick = () => {
  const out = dst.classList.contains("empty") ? "" : dst.textContent;
  const newFrom = S.to;
  S.to = S.from === "auto" ? (newFrom === "vi" ? "en" : "vi") : S.from;
  S.from = newFrom;
  $("#from").value = S.from; $("#to").value = S.to;
  if (out) src.value = out;
  save(); fillVoices(); schedule();
};
$("#clear").onclick = () => { src.value = ""; schedule(); src.focus(); };
$("#copy").onclick = async () => {
  if (dst.classList.contains("empty")) return;
  try { await navigator.clipboard.writeText(dst.textContent); status("Đã sao chép"); setTimeout(() => status(""), 1500); }
  catch (e) { status("Không sao chép được", true); }
};

/* ---------- Giọng đọc ---------- */
let voices = [];
function fillVoices() {
  voices = speechSynthesis.getVoices();
  const pre = info(S.to)[2].split("-")[0];
  const list = voices.filter(v => v.lang.toLowerCase().startsWith(pre));
  const sel = $("#voice");
  sel.innerHTML = list.length
    ? list.map(v => `<option value="${v.voiceURI}">${v.name}</option>`).join("")
    : '<option value="">Giọng mặc định của trình duyệt</option>';
  const saved = S.voice[S.to];
  if (saved && list.some(v => v.voiceURI === saved)) sel.value = saved;
  else if (list.length) S.voice[S.to] = sel.value;
}
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = fillVoices;
  fillVoices();
} else {
  $("#say").style.display = "none"; $("#test").disabled = true;
}

function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.voiceURI === S.voice[S.to]);
  u.lang = v ? v.lang : info(S.to)[2];
  if (v) u.voice = v;
  u.rate = +S.rate; u.pitch = +S.pitch; u.volume = +S.vol;
  speechSynthesis.speak(u);
}

$("#voice").onchange = e => { S.voice[S.to] = e.target.value; save(); };
for (const k of ["rate", "pitch", "vol"]) {
  const el = $("#" + k), lab = $("#" + k + "V");
  el.value = S[k]; lab.textContent = (+S[k]).toFixed(2).replace(/\.?0+$/, "");
  el.oninput = () => { S[k] = el.value; lab.textContent = (+el.value).toFixed(2).replace(/\.?0+$/, ""); save(); };
}
$("#say").onclick = () => { if (!dst.classList.contains("empty")) speak(dst.textContent); };
$("#test").onclick = () => {
  const t = dst.classList.contains("empty") ? "" : dst.textContent;
  speak(t || { vi: "Xin chào, đây là giọng đọc thử.", en: "Hello, this is a voice test.", ja: "こんにちは、音声テストです。",
    ko: "안녕하세요, 음성 테스트입니다.", fr: "Bonjour, ceci est un test de voix.", de: "Hallo, das ist ein Stimmtest.",
    es: "Hola, esta es una prueba de voz." }[S.to] || "Hello");
};

/* ---------- Nói để nhập ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) { $("#mic").style.display = "none"; }
else $("#mic").onclick = () => {
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = info(S.from === "auto" ? "vi" : S.from)[2];
  rec.interimResults = true;
  rec.onresult = e => { src.value = Array.from(e.results).map(r => r[0].transcript).join(""); schedule(); };
  rec.onend = () => { rec = null; $("#mic").classList.remove("on"); };
  rec.onerror = () => status("Không nhận được giọng nói, kiểm tra quyền micro.", true);
  rec.start(); $("#mic").classList.add("on");
};

setOut(""); dst.textContent = "Bản dịch sẽ hiện ở đây"; dst.classList.add("empty");
</script>
</body>
</html>
